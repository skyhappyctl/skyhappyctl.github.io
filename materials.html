    // Direct file previews use system fallbacks; HTTP(S) previews load the bundled fonts.
    // This avoids browser file:// font restrictions without third-party services.
    if (location.protocol !== "file:") {
      const sheet = document.createElement("link");
      sheet.rel = "stylesheet";
      sheet.href = "assets/fonts/fonts.css";
      document.head.appendChild(sheet);
      for (const font of ["profile-serif-sc.woff2"]) {
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "font";
        preload.type = "font/woff2";
        preload.crossOrigin = "anonymous";
        preload.href = "assets/fonts/" + font;
        document.head.appendChild(preload);
      }
    }
  </script>
