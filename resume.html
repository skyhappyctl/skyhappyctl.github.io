<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>陈天乐 · 个人简历 PDF</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .resume-redirect { margin-block: 48px; }
    .resume-redirect h1 { font-size: 26px; }
    .resume-actions { display: flex; flex-wrap: wrap; gap: 12px 24px; }
  </style>
</head>
<body>
  <main class="container resume-redirect">
    <h1>陈天乐 · 个人简历</h1>
    <p id="resume-status" role="status">正在打开你的原版个人简历 PDF；如果未自动打开，请使用下方链接。</p>
    <p class="resume-actions">
      <a id="resume-open" href="assets/个人简历-陈天乐.pdf">查看个人简历 PDF</a>
      <a id="resume-download" href="assets/个人简历-陈天乐.pdf" download>下载个人简历</a>
      <a href="index.html">返回个人主页</a>
    </p>
    <noscript><p>浏览器未启用 JavaScript，请点击“查看个人简历 PDF”。</p></noscript>
  </main>
  <!-- 兼容以前的 resume.html 链接；不再根据主页文字生成另一份简历。
       PDF 地址取自 content.js 的 resume.pdf。若更换文件名，请同步更新上方无脚本备用链接。 -->
  <script src="content.js"></script>
  <script>
    (() => {
      "use strict";
      try {
        const pdf = window.PROFILE?.resume?.pdf;
        // 与构建公开清单一致：仅允许 assets/ 下的本地 PDF，禁止外部跳转和路径穿越。
        if (typeof pdf !== "string" || !/^assets\/[\p{L}\p{N}_./-]+\.pdf$/iu.test(pdf) || pdf.split("/").includes("..")) {
          throw new Error("Invalid local resume PDF path.");
        }
        const url = new URL(pdf, document.baseURI).href;
        document.getElementById("resume-open").href = url;
        document.getElementById("resume-download").href = url;
        window.location.replace(url);
      } catch {
        document.getElementById("resume-status").textContent = "无法自动打开简历，请使用下方 PDF 链接查看或下载。";
      }
    })();
  </script>
</body>
</html>
